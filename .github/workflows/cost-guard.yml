name: Cost guard

on:
  pull_request:
  push:
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact cost guard exit contract
        run: scripts/test-cost-guard.sh
