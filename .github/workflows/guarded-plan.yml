name: Guarded OpenTofu plan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Initialize remote state
        shell: bash
        run: |
          if ! tofu init -input=false -backend-config="bucket=${{ secrets.GCP_STATE_BUCKET }}" >/dev/null 2>&1; then
            printf '%s\n' 'Remote state initialization failed.' >&2
            exit 1
          fi
      - name: Plan and enforce cost guard
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
          TF_VAR_state_bucket_name: ${{ secrets.GCP_STATE_BUCKET }}
          TF_VAR_github_repository: ${{ secrets.GITHUB_REPOSITORY_IDENTITY }}
          TF_VAR_github_ref: refs/heads/main
        shell: bash
        run: |
          set +e
          set -o pipefail
          tofu plan -input=false -json 2>/dev/null | scripts/cost-guard.sh /dev/stdin 2>/dev/null
          statuses=("${PIPESTATUS[@]}")
          plan_status=${statuses[0]}
          guard_status=${statuses[1]}
          set -e
          if [[ "$plan_status" -ne 0 ]]; then
            printf '%s\n' 'Guarded plan result: plan failure.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$guard_status" in
            0) printf '%s\n' 'Guarded plan result: allow.' >> "$GITHUB_STEP_SUMMARY" ;;
            1) printf '%s\n' 'Guarded plan result: deny.' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            2) printf '%s\n' 'Guarded plan result: undecidable.' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            *) printf '%s\n' 'Guarded plan result: undecidable.' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
