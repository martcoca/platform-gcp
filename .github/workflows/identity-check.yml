name: Verify keyless GCP identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Assert the active account
        env:
          EXPECTED_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format=value(account) 2>/dev/null)" = "$EXPECTED_SERVICE_ACCOUNT"
